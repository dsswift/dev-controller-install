---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: environments.dev.dsswift.github.io
spec:
  group: dev.dsswift.github.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    shortNames:
    - env
    singular: environment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.owner.name
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: Ends
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Environment is one environment: a project's namespace with an owner, a
          kind, and an end. Its name is the namespace's name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec is what was asked for.
            properties:
              kind:
                description: Kind is what the environment is for.
                enum:
                - dev
                - preview
                - agent
                - uat
                - demo
                - test
                - prod
                type: string
              lifetime:
                description: |-
                  Lifetime is how long the environment lives after its last activity.
                  Unset means it has no end.
                type: string
              owner:
                description: Owner is who made the environment and manages it.
                properties:
                  issuer:
                    description: Issuer is the settings name of the sign-in the owner
                      used.
                    minLength: 1
                    type: string
                  name:
                    description: Name is the owner's part of the environment's name.
                    minLength: 1
                    type: string
                  subject:
                    description: Subject is the owner's identity at that issuer.
                    minLength: 1
                    type: string
                required:
                - issuer
                - name
                - subject
                type: object
              project:
                description: Project is the project the environment runs.
                minLength: 1
                type: string
              pullRequest:
                description: PullRequest is the pull or merge request a preview shows.
                type: string
              services:
                description: |-
                  Services are the names of the hosts the environment was asked for
                  when it was made. A host is named after its service unless the
                  service names it. A deploy routes a host whether or not it is here.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - kind
            - owner
            - project
            type: object
            x-kubernetes-validations:
            - message: project cannot change
              rule: self.project == oldSelf.project
            - message: kind cannot change
              rule: self.kind == oldSelf.kind
            - message: owner cannot change
              rule: self.owner == oldSelf.owner
          status:
            description: EnvironmentStatus is what the controller made of it.
            properties:
              conditions:
                description: Conditions carries Ready, for tools that wait on a condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              copiedSecrets:
                description: |-
                  CopiedSecrets are the secrets the controller copied in, so it can
                  remove one the estate no longer lists.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              expiresAt:
                description: 'ExpiresAt is the end: LastActivity plus the lifetime.'
                format: date-time
                type: string
              hosts:
                description: |-
                  Hosts are the environment's hostnames: each host a deploy routed,
                  with the service that answers on it and its paths, and each host
                  asked for when the environment was made that no deploy has routed.
                items:
                  description: |-
                    Host is one hostname of an environment, and the service that answers on
                    it. Two services may share a host on different paths.
                  properties:
                    host:
                      type: string
                    name:
                      description: Name is the host's name under the estate's rule.
                      type: string
                    paths:
                      description: |-
                        Paths are the paths on the host that reach the service. Empty until
                        a deploy routes it.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    service:
                      description: |-
                        Service is the service that routes the host, or, before a deploy,
                        the name the host was asked for under.
                      type: string
                  required:
                  - host
                  - service
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              lastActivity:
                description: |-
                  LastActivity is the last time anything was done to the environment.
                  The end counts from here.
                format: date-time
                type: string
              message:
                description: Message says why the environment is not ready.
                type: string
              namespace:
                description: Namespace is the namespace the environment runs in.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, Blocked, or Removing.
                type: string
              services:
                description: |-
                  Services is what the last build and the last deploy of each service
                  left: the image the controller built, and every object it applied, so
                  the next deploy can prune what this one made and that one drops.
                items:
                  description: ServiceStatus is what the controller built and applied
                    for one service.
                  properties:
                    build:
                      description: Build is the image the controller last built for
                        the service.
                      properties:
                        builtAt:
                          description: BuiltAt is when it was built.
                          format: date-time
                          type: string
                        context:
                          description: Context is the digest of the build context.
                          type: string
                        id:
                          description: |-
                            ID names the build: a digest of the build context and of how it was
                            built.
                          type: string
                        image:
                          description: Image is the image in the environment registry,
                            by digest.
                          type: string
                      required:
                      - context
                      - id
                      - image
                      type: object
                    deployedAt:
                      description: DeployedAt is when the service was last deployed.
                      format: date-time
                      type: string
                    inventory:
                      description: Inventory is every object the last deploy of the
                        service applied.
                      items:
                        description: ObjectRef names one object in the environment's
                          namespace.
                        properties:
                          group:
                            description: Group is the object's API group. Empty is
                              the core group.
                            type: string
                          hash:
                            description: |-
                              Hash is a digest of the object as it was applied, so the next deploy
                              can say what changed.
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
                          version:
                            description: |-
                              Version is the API version it was applied at, so it can be deleted
                              with no lookup.
                            type: string
                        required:
                        - kind
                        - name
                        - version
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    mode:
                      description: |-
                        Mode is set when the last deploy of the service was not a plain one:
                        dev for its dev form, debug for its debug form.
                      enum:
                      - dev
                      - debug
                      type: string
                    name:
                      description: Name is the service's name in the project's file.
                      type: string
                    routed:
                      description: |-
                        Routed says the last deploy made an Ingress for the service, so a
                        host answers.
                      type: boolean
                    routes:
                      description: |-
                        Routes are the hosts the last deploy of the service routed, with
                        their paths. A record from before routes were kept has Routed and no
                        routes: its one host is named after the service, on every path.
                      items:
                        description: Route is one host a service's last deploy routed.
                        properties:
                          host:
                            description: Host is the hostname the rule made of it.
                            type: string
                          name:
                            description: Name is the host's name under the estate's
                              rule.
                            type: string
                          paths:
                            description: Paths are the paths on the host that reach
                              the service.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          url:
                            description: URL is the host's address.
                            type: string
                        required:
                        - host
                        - name
                        - paths
                        - url
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    stale:
                      description: |-
                        Stale is the images built for the service before the one in Build.
                        The registry may still hold them. They are removed once a deploy of
                        the service is healthy on the newer image.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
